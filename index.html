<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5fb8f0" />
    <title>Harbourmaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The loading screen, up before the game's code and styles arrive (src/ui/loading.ts):
         the sea at dusk, and something cheeky to read while it loads. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(
          #0f1626 0%,
          #1c2a45 55%,
          #2d4363 72%,
          #14304a 72.2%,
          #0c2238 100%
        );
        color: #a7b1c2;
        font:
          500 13px Inter,
          system-ui,
          sans-serif;
        transition: opacity 0.5s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #loading .swell {
        animation: drift 9s linear infinite;
      }
      #loading .swell.back {
        animation-duration: 14s;
        animation-direction: reverse;
      }
      #loading .gull {
        animation: fly 18s linear infinite;
      }
      #loading .rays {
        transform-origin: 1000px 110px;
        animation: spin 40s linear infinite;
      }
      #loading .cloud {
        animation: cloud 60s linear infinite alternate;
      }
      #loading .cloud.slow {
        animation-duration: 90s;
        animation-direction: alternate-reverse;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes cloud {
        to {
          transform: translateX(160px);
        }
      }

      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-400px);
        }
      }
      @keyframes fly {
        from {
          transform: translate(-200px, 0);
        }
        50% {
          transform: translate(900px, -40px);
        }
        to {
          transform: translate(2000px, 10px);
        }
      }
      #loading .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 22vh;
        padding: 22px 30px 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(20, 27, 41, 0.9);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 20px 50px rgba(10, 40, 70, 0.35);
      }
      #loading h1 {
        margin: 0;
        color: #edf1f7;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #loading .tag {
        margin: -6px 0 2px;
        color: #f5b83d;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #loading .bar {
        position: relative;
        width: min(300px, 70vw);
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      #loading .bar span {
        position: relative;
        display: block;
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #e59a2a, #f5b83d 60%, #ffd77e);
        box-shadow: 0 0 12px rgba(245, 184, 61, 0.55);
        transition: width 0.25s;
        overflow: hidden;
      }
      /* A glint running along the filled part. */
      #loading .bar span::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: translateX(-100%);
        animation: glint 1.6s ease-in-out infinite;
      }
      @keyframes glint {
        to {
          transform: translateX(100%);
        }
      }
      #loading .what {
        min-height: 1.2em;
      }
      #loading .quip {
        min-height: 1.2em;
        color: #7f8ca3;
        font-size: 12px;
        font-style: italic;
        transition: opacity 0.3s;
      }
      /* Creeps on while the game's code downloads, before it can tell how far along it is. */
      #loading:not(.js) .bar span {
        animation: creep 10s ease-out forwards;
      }
      @keyframes creep {
        to {
          width: 10%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading *,
        #loading *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="loading"
      role="progressbar"
      aria-label="Loading the game"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="4"
    >
      <svg
        class="scene"
        viewBox="0 0 1600 900"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="ld-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fb8f0" />
            <stop offset="0.7" stop-color="#a6dcfb" />
            <stop offset="1" stop-color="#dff4ff" />
          </linearGradient>
          <radialGradient id="ld-sun">
            <stop offset="0" stop-color="#fff6c8" />
            <stop offset="0.45" stop-color="#ffe066" />
            <stop offset="1" stop-color="#ffe066" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="ld-sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2cb4d8" />
            <stop offset="1" stop-color="#147fae" />
          </linearGradient>
        </defs>
        <rect width="1600" height="660" fill="url(#ld-sky)" />
        <circle cx="1000" cy="110" r="150" fill="url(#ld-sun)" />
        <g class="rays" stroke="#ffe680" stroke-width="6" stroke-linecap="round" opacity="0.7">
          <path
            d="M1000 10 V-10 M1000 210 V230 M900 110 H880 M1100 110 H1120 M929 39 L915 25 M1071 181 L1085 195 M1071 39 L1085 25 M929 181 L915 195"
          />
        </g>
        <circle cx="1000" cy="110" r="56" fill="#ffd84d" />
        <g fill="#ffffff">
          <g class="cloud">
            <ellipse cx="260" cy="170" rx="90" ry="34" />
            <ellipse cx="320" cy="150" rx="60" ry="40" />
            <ellipse cx="210" cy="160" rx="50" ry="30" />
          </g>
          <g class="cloud slow" opacity="0.85">
            <ellipse cx="820" cy="110" rx="70" ry="26" />
            <ellipse cx="870" cy="95" rx="48" ry="32" />
          </g>
          <g class="cloud" opacity="0.9">
            <ellipse cx="1460" cy="320" rx="80" ry="28" />
            <ellipse cx="1500" cy="305" rx="52" ry="34" />
          </g>
        </g>
        <path
          class="gull"
          d="M0 300 q10 -9 20 0 q10 -9 20 0"
          fill="none"
          stroke="#3d4a5c"
          stroke-width="2.5"
          stroke-linecap="round"
        />

        <rect y="648" width="1600" height="252" fill="url(#ld-sea)" />
        <path
          class="swell back"
          d="M0 660 Q50 650 100 660 T200 660 T300 660 T400 660 T500 660 T600 660 T700 660 T800 660 T900 660 T1000 660 T1100 660 T1200 660 T1300 660 T1400 660 T1500 660 T1600 660 T1700 660 T1800 660 T1900 660 T2000 660 V900 H0 Z"
          fill="#45c8e6"
        />

        <path
          class="swell"
          d="M0 745 Q50 732 100 745 T200 745 T300 745 T400 745 T500 745 T600 745 T700 745 T800 745 T900 745 T1000 745 T1100 745 T1200 745 T1300 745 T1400 745 T1500 745 T1600 745 T1700 745 T1800 745 T1900 745 T2000 745 V900 H0 Z"
          fill="#2aa9d4"
        />
        <path
          class="swell back"
          d="M0 800 Q50 790 100 800 T200 800 T300 800 T400 800 T500 800 T600 800 T700 800 T800 800 T900 800 T1000 800 T1100 800 T1200 800 T1300 800 T1400 800 T1500 800 T1600 800 T1700 800 T1800 800 T1900 800 T2000 800 V900 H0 Z"
          fill="#1b93c3"
        />
      </svg>
      <div class="card">
        <h1>Harbourmaster</h1>
        <div class="tag">Crates in, crates out. Mostly.</div>
        <div class="bar"><span></span></div>
        <div class="what">Loading the game…</div>
        <div class="quip"></div>
      </div>
    </div>
    <script>
      // Something cheeky to read while the game loads, a new one every few seconds.
      (function () {
        var quips = [
          'Untangling the mooring lines…',
          'Counting the fish. Twice. One got away.',
          'Teaching dockhands to lift with their legs…',
          'Bribing the seagulls to stay off the crates…',
          'Hosing down the jetty…',
          'Persuading the harbour office to open on a Sunday…',
          'Checking the tide tables. It is coming in. Probably.',
          'Stacking crates. Restacking crates.',
          'Asking the forklifts nicely to stay off the bench…',
          'Pretending the ice cubes are not melting…',
        ];
        var el = document.querySelector('#loading .quip');
        if (!el) return;
        var k = Math.floor(Math.random() * quips.length);
        var show = function () {
          el.style.opacity = '0';
          setTimeout(function () {
            el.textContent = quips[k++ % quips.length];
            el.style.opacity = '1';
          }, 300);
        };
        show();
        var timer = setInterval(function () {
          if (!document.getElementById('loading')) return clearInterval(timer);
          show();
        }, 2600);
      })();
    </script>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
