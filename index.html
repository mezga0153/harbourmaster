<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141b29" />
    <title>Harbourmaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The loading screen, up before the game's code and styles arrive (src/ui/loading.ts). */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #141b29;
        color: #a7b1c2;
        font:
          500 13px Inter,
          system-ui,
          sans-serif;
        transition: opacity 0.4s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        margin: 0;
        color: #edf1f7;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #loading .bar {
        width: min(280px, 70vw);
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      #loading .bar span {
        display: block;
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: #f5b83d;
        transition: width 0.25s;
      }
      /* Creeps on while the game's code downloads, before it can tell how far along it is. */
      #loading:not(.js) .bar span {
        animation: creep 10s ease-out forwards;
      }
      @keyframes creep {
        to {
          width: 10%;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="loading"
      role="progressbar"
      aria-label="Loading the game"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="4"
    >
      <h1>Harbourmaster</h1>
      <div class="bar"><span></span></div>
      <div class="what">Loading the game…</div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
