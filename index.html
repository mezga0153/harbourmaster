<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Harbourmaster: build a busy port from a little fishing jetty</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://harbourmaster.tinetov.net/" />
    <meta property="og:title" content="Harbourmaster — Build Your Own Port" />
    <meta
      property="og:description"
      content="Build a little fishing jetty into a busy port. Manage boats, dockhands, forklifts and cranes in this free browser game."
    />
    <meta property="og:image" content="https://harbourmaster.tinetov.net/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="Harbourmaster — Build Your Own Port" />
    <meta
      name="twitter:description"
      content="Build a little fishing jetty into a busy port. Manage boats, dockhands, forklifts and cranes in this free browser game."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Harbourmaster",
        "url": "https://harbourmaster.tinetov.net/",
        "image": "https://harbourmaster.tinetov.net/og.jpg",
        "description": "Grow a little fishing jetty into a busy harbour: boats, dockhands, forklifts, cranes and a town that grows with you.",
        "genre": ["Simulation", "Strategy", "City builder"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The title screen, up before the game's code and styles arrive (src/ui/loading.ts):
         a sunny bit of sea, what to play, and something cheeky to read while it loads. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(
          #0f1626 0%,
          #1c2a45 55%,
          #2d4363 72%,
          #14304a 72.2%,
          #0c2238 100%
        );
        color: #a7b1c2;
        font:
          500 13px Inter,
          system-ui,
          sans-serif;
        transition: opacity 0.5s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #loading .swell {
        animation: drift 9s linear infinite;
      }
      #loading .swell.back {
        animation-duration: 14s;
        animation-direction: reverse;
      }
      #loading .gull {
        animation: fly 18s linear infinite;
      }
      #loading .rays {
        transform-origin: 1000px 110px;
        animation: spin 40s linear infinite;
      }
      #loading .cloud {
        animation: cloud 60s linear infinite alternate;
      }
      #loading .cloud.slow {
        animation-duration: 90s;
        animation-direction: alternate-reverse;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes cloud {
        to {
          transform: translateX(160px);
        }
      }

      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-400px);
        }
      }
      @keyframes fly {
        from {
          transform: translate(-200px, 0);
        }
        50% {
          transform: translate(900px, -40px);
        }
        to {
          transform: translate(2000px, 10px);
        }
      }
      #loading .bob {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: bob 3.2s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-2.5deg);
        }
        50% {
          transform: translateY(7px) rotate(2.5deg);
        }
      }
      #loading .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(400px, calc(100vw - 32px));
        box-sizing: border-box;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        margin-bottom: min(22vh, 160px);
        padding: 22px 26px 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(20, 27, 41, 0.9);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 20px 50px rgba(10, 40, 70, 0.35);
      }
      #loading h1 {
        margin: 0;
        color: #edf1f7;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #loading .tag {
        margin: -6px 0 2px;
        color: #f5b83d;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #loading .bar {
        position: relative;
        width: min(300px, 70vw);
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      #loading .bar span {
        position: relative;
        display: block;
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #e59a2a, #f5b83d 60%, #ffd77e);
        box-shadow: 0 0 12px rgba(245, 184, 61, 0.55);
        transition: width 0.25s;
        overflow: hidden;
      }
      /* A glint running along the filled part. */
      #loading .bar span::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: translateX(-100%);
        animation: glint 1.6s ease-in-out infinite;
      }
      @keyframes glint {
        to {
          transform: translateX(100%);
        }
      }
      #loading.failed .bar {
        display: none;
      }
      #loading .blurb {
        margin: 0;
        color: #c3cbd8;
        font-size: 13.5px;
        line-height: 1.5;
        text-align: center;
      }
      /* What to play: up once the game knows what is saved in this browser. */
      #loading .menu {
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        margin-top: 4px;
      }
      #loading.menu-up:not(.picked):not(.failed):not(.levels-up) .menu {
        display: flex;
        animation: rise 0.35s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      #loading .go {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 11px 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: #edf1f7;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.15s,
          box-shadow 0.15s;
      }
      #loading .go[hidden] {
        display: none;
      }
      #loading .go:hover,
      #loading .go:focus-visible {
        transform: translateY(-2px) rotate(-0.6deg);
        background: rgba(255, 255, 255, 0.12);
        outline: none;
      }
      #loading .go:active {
        transform: translateY(1px);
      }
      #loading .go.primary {
        border-color: transparent;
        background: linear-gradient(#ffd77e, #f5b83d 55%, #e59a2a);
        color: #2a1c05;
        box-shadow:
          0 3px 0 #b8741a,
          0 8px 20px rgba(245, 184, 61, 0.3);
      }
      #loading .go.primary:hover,
      #loading .go.primary:focus-visible {
        background: linear-gradient(#ffe39c, #f7c254 55%, #eba53a);
        box-shadow:
          0 5px 0 #b8741a,
          0 12px 24px rgba(245, 184, 61, 0.4);
      }
      #loading .go.quiet {
        border-color: transparent;
        background: none;
        color: #a7b1c2;
        font-size: 13px;
        font-weight: 500;
        padding: 6px;
      }
      #loading .go.quiet:hover,
      #loading .go.quiet:focus-visible {
        color: #edf1f7;
        background: none;
      }
      #loading .go small {
        font-size: 11.5px;
        font-weight: 500;
        opacity: 0.75;
      }
      /* A new port: how rough a sea, in place of the menu. */
      #loading .levels {
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      #loading.menu-up.levels-up:not(.picked):not(.failed) .levels {
        display: flex;
        animation: rise 0.35s ease-out;
      }
      #loading .levels-title {
        color: #f5b83d;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-align: center;
        text-transform: uppercase;
      }
      #loading .levels .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #loading .go.level {
        position: relative;
        align-items: flex-start;
        padding: 10px 64px 10px 16px;
        text-align: left;
        border-left: 4px solid var(--sea);
      }
      #loading .go.level small {
        font-size: 12px;
        line-height: 1.35;
      }
      /* Waves, more of them the rougher the sea. */
      #loading .go.level::after {
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: var(--sea);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.12em;
      }
      #loading .go.level:hover::after,
      #loading .go.level:focus-visible::after {
        animation: wobble 0.9s ease-in-out infinite;
      }
      @keyframes wobble {
        50% {
          transform: translate(3px, -50%) rotate(-6deg);
        }
      }
      #loading .go.level.easy {
        --sea: #7fdcc0;
      }
      #loading .go.level.easy::after {
        content: '~';
      }
      #loading .go.level.medium {
        --sea: #5fb8f0;
      }
      #loading .go.level.medium::after {
        content: '~~';
      }
      #loading .go.level.hard {
        --sea: #ff7a6b;
      }
      #loading .go.level.hard::after {
        content: '~~~';
      }
      #loading .note {
        max-width: 100%;
        color: #ffb59a;
        font-size: 12.5px;
        line-height: 1.45;
        text-align: center;
      }
      /* The models are in and the menu waits on the player: nothing to show loading. */
      #loading.idle .bar,
      #loading.idle .what,
      #loading.idle .quip {
        display: none;
      }
      @media (max-height: 560px) {
        #loading .card {
          margin-bottom: 0;
          gap: 8px;
          padding: 14px 20px 12px;
        }
        #loading .blurb {
          display: none;
        }
      }
      #loading .what {
        max-width: min(320px, 80vw);
        text-align: center;
        line-height: 1.45;
        min-height: 1.2em;
      }
      #loading .quip {
        min-height: 1.2em;
        color: #7f8ca3;
        font-size: 12px;
        font-style: italic;
        transition: opacity 0.3s;
      }
      /* Creeps on while the game's code downloads, before it can tell how far along it is. */
      #loading:not(.js) .bar span {
        animation: creep 10s ease-out forwards;
      }
      @keyframes creep {
        to {
          width: 10%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading *,
        #loading *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <svg
        class="scene"
        viewBox="0 0 1600 900"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="ld-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fb8f0" />
            <stop offset="0.7" stop-color="#a6dcfb" />
            <stop offset="1" stop-color="#dff4ff" />
          </linearGradient>
          <radialGradient id="ld-sun">
            <stop offset="0" stop-color="#fff6c8" />
            <stop offset="0.45" stop-color="#ffe066" />
            <stop offset="1" stop-color="#ffe066" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="ld-sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2cb4d8" />
            <stop offset="1" stop-color="#147fae" />
          </linearGradient>
        </defs>
        <rect width="1600" height="660" fill="url(#ld-sky)" />
        <circle cx="1000" cy="110" r="150" fill="url(#ld-sun)" />
        <g class="rays" stroke="#ffe680" stroke-width="6" stroke-linecap="round" opacity="0.7">
          <path
            d="M1000 10 V-10 M1000 210 V230 M900 110 H880 M1100 110 H1120 M929 39 L915 25 M1071 181 L1085 195 M1071 39 L1085 25 M929 181 L915 195"
          />
        </g>
        <circle cx="1000" cy="110" r="56" fill="#ffd84d" />
        <g fill="#ffffff">
          <g class="cloud">
            <ellipse cx="260" cy="170" rx="90" ry="34" />
            <ellipse cx="320" cy="150" rx="60" ry="40" />
            <ellipse cx="210" cy="160" rx="50" ry="30" />
          </g>
          <g class="cloud slow" opacity="0.85">
            <ellipse cx="480" cy="250" rx="70" ry="26" />
            <ellipse cx="530" cy="235" rx="48" ry="32" />
          </g>
          <g class="cloud" opacity="0.9">
            <ellipse cx="1460" cy="320" rx="80" ry="28" />
            <ellipse cx="1500" cy="305" rx="52" ry="34" />
          </g>
        </g>
        <path
          class="gull"
          d="M0 300 q10 -9 20 0 q10 -9 20 0"
          fill="none"
          stroke="#3d4a5c"
          stroke-width="2.5"
          stroke-linecap="round"
        />

        <rect y="648" width="1600" height="252" fill="url(#ld-sea)" />
        <path
          class="swell back"
          d="M0 660 Q50 650 100 660 T200 660 T300 660 T400 660 T500 660 T600 660 T700 660 T800 660 T900 660 T1000 660 T1100 660 T1200 660 T1300 660 T1400 660 T1500 660 T1600 660 T1700 660 T1800 660 T1900 660 T2000 660 V900 H0 Z"
          fill="#45c8e6"
        />
        <g class="boat">
          <g class="bob">
            <path d="M1166 640 V588 L1206 628 Z" fill="#fff6e0" />
            <path d="M1166 640 V572" stroke="#5a4636" stroke-width="5" stroke-linecap="round" />
            <path d="M1166 574 L1186 580 L1166 586 Z" fill="#e8524a" />
            <rect x="1118" y="626" width="34" height="26" rx="4" fill="#f4efe4" />
            <rect x="1124" y="632" width="10" height="9" rx="2" fill="#5fb8f0" />
            <rect x="1114" y="620" width="42" height="8" rx="3" fill="#e8524a" />
            <path d="M1080 650 H1236 L1218 684 Q1160 694 1100 684 Z" fill="#e8524a" />
            <path d="M1084 658 H1232" stroke="#ffffff" stroke-width="5" />
          </g>
        </g>

        <path
          class="swell"
          d="M0 745 Q50 732 100 745 T200 745 T300 745 T400 745 T500 745 T600 745 T700 745 T800 745 T900 745 T1000 745 T1100 745 T1200 745 T1300 745 T1400 745 T1500 745 T1600 745 T1700 745 T1800 745 T1900 745 T2000 745 V900 H0 Z"
          fill="#2aa9d4"
        />
        <path
          class="swell back"
          d="M0 800 Q50 790 100 800 T200 800 T300 800 T400 800 T500 800 T600 800 T700 800 T800 800 T900 800 T1000 800 T1100 800 T1200 800 T1300 800 T1400 800 T1500 800 T1600 800 T1700 800 T1800 800 T1900 800 T2000 800 V900 H0 Z"
          fill="#1b93c3"
        />
      </svg>
      <div class="card">
        <h1>Harbourmaster</h1>
        <div class="tag">Crates in, crates out. Mostly.</div>
        <p class="blurb">
          The town has handed you the keys to a creaky little fishing jetty. Land the catch, keep
          the shops stocked and the gulls off the crates, and grow it, plank by plank, into a busy
          port.
        </p>
        <nav class="menu" aria-label="Play">
          <button class="go primary" data-go="continue" hidden>
            <span>Carry on</span><small></small>
          </button>
          <button class="go" data-go="new"><span>New port</span></button>
          <button class="go quiet" data-go="file"><span>Load a save file</span></button>
          <input type="file" accept=".json,application/json" hidden />
        </nav>
        <div class="levels" role="group" aria-labelledby="levels-title">
          <div class="levels-title" id="levels-title">How rough a sea?</div>
          <div class="list"></div>
          <button class="go quiet back"><span>Back</span></button>
        </div>
        <div class="note" role="status" hidden></div>
        <div
          class="bar"
          role="progressbar"
          aria-label="Loading the game"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="4"
        >
          <span></span>
        </div>
        <div class="what">Loading the game…</div>
        <div class="quip"></div>
      </div>
    </div>
    <script>
      // Something cheeky to read while the game loads, a new one every few seconds.
      (function () {
        var quips = [
          'Untangling the mooring lines…',
          'Counting the fish. Twice. One got away.',
          'Teaching dockhands to lift with their legs…',
          'Bribing the seagulls to stay off the crates…',
          'Hosing down the jetty…',
          'Persuading the harbour office to open on a Sunday…',
          'Checking the tide tables. It is coming in. Probably.',
          'Stacking crates. Restacking crates.',
          'Asking the forklifts nicely to stay off the bench…',
          'Pretending the ice cubes are not melting…',
        ];
        var el = document.querySelector('#loading .quip');
        if (!el) return;
        var k = Math.floor(Math.random() * quips.length);
        var show = function () {
          el.style.opacity = '0';
          setTimeout(function () {
            el.textContent = quips[k++ % quips.length];
            el.style.opacity = '1';
          }, 300);
        };
        show();
        var timer = setInterval(function () {
          if (!document.getElementById('loading')) return clearInterval(timer);
          show();
        }, 2600);
      })();
    </script>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
